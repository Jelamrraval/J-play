<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-Play | Tic Tac Toe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="tttc.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand fs-3 fw-bold">J-play</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="httt.html">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5 text-center">
        <h1 class="mb-4 text-warning">Tic Tac Toe</h1>
        
        <div class="d-flex justify-content-center align-items-center mb-4">
            <div id="status" class="lead fw-bold me-3">Player X's Turn</div>
            <button id="reset-button" class="btn btn-primary">Reset Game</button>
        </div>
        
        <div class="board" id="game-board"></div>
    </main>

    <footer class="bg-light text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0 text-muted">&copy; 2025 J-Play Website. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="tttjs.js"></script>
</body>
</html>
